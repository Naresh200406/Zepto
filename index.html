<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zepto Application
    </title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <nav>
        <section id="nav1">

                </div>

                    <p id="location"><i class="fa-solid fa-location-dot"></i>Select Address</p>

            </aside>
            <aside id="links">

            </aside>

        </section>

    <!-- !HEADER -->
  <header>
    <div id="banner-container">
      <img src="./hero-background-1.png" alt="banner1">
      <img src="./hero-background-2.png" alt="banner2">
      <img src="./hero-background-1.png" alt="banner3">
    </div>
  </header>
  <!-- !CATEGORY -->
   <section id="category">
    <article id="category-title">
      <h2>Shop by Category</h2>
    </article>
    <article id="category-items">
    </article>
   </section>

    
    <script src="./script.js"></script>
